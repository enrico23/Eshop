name: .NET 10 CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Restore dependencies
        run: dotnet restore src/EShop.sln

      - name: Build
        run: dotnet build src/EShop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test src/EShop.sln --configuration Release --no-build --verbosity normal
